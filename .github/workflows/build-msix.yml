name: Build ALLAHVERDCAN.QOVX MSIX Store Package

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_msix:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore QOVX Dependencies
      run: dotnet restore Qovx/Qovx.csproj

    - name: Publish Native x64 Application
      run: |
        dotnet publish Qovx/Qovx.csproj -c Release -r win-x64 --self-contained false -o AppPublish

    - name: Prepare MSIX Layout Directory
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path PackageLayout
        Copy-Item -Path AppPublish\* -Destination PackageLayout -Recurse -Force
        Copy-Item -Path Qovx\Package.appxmanifest -Destination PackageLayout\AppxManifest.xml -Force
        Copy-Item -Path Qovx\Assets -Destination PackageLayout\Assets -Recurse -Force

    - name: Pack Official Store MSIX via MakeAppx
      shell: pwsh
      run: |
        $makeAppx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
        Write-Host "Packing with MakeAppx: $makeAppx"
        & $makeAppx pack /d PackageLayout /p ALLAHVERDCAN.QOVX_2.0.4.0_x64.msix /o

    - name: Upload Store-Ready MSIX Package
      uses: actions/upload-artifact@v4
      with:
        name: ALLAHVERDCAN-QOVX-Store-MSIX
        path: ALLAHVERDCAN.QOVX_2.0.4.0_x64.msix
        retention-days: 30
